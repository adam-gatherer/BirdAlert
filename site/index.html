<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The latest notable bird sightings recorded by BirdAlert.">
    <title>BirdAlert | Latest UK sightings</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <h1>BirdAlert</h1>
      <p>Latest notable bird sightings from the UK BirdAlert feed.</p>

      <hr>

      <h2>Live data</h2>
      <p id="status" class="status" role="status">Loading sightings...</p>
      <p id="freshness">Data freshness: checking...</p>
      <table>
        <thead>
          <tr>
            <th scope="col">Species</th>
            <th scope="col">Location</th>
            <th scope="col">Observed</th>
          </tr>
        </thead>
        <tbody id="sightings" aria-live="polite"></tbody>
      </table>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
